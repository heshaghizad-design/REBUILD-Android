          @Composable
          private fun V18SafetyScreen() {
              var neck by rememberSaveable { mutableFloatStateOf(0f) }
              var knee by rememberSaveable { mutableFloatStateOf(0f) }
              var tingling by rememberSaveable { mutableStateOf(false) }
              var weakness by rememberSaveable { mutableStateOf(false) }
              var radiating by rememberSaveable { mutableStateOf(false) }
              val red = tingling || weakness || radiating || neck >= 6 || knee >= 6
              val yellow = !red && (neck >= 3 || knee >= 3)
              LazyColumn(
                  Modifier.fillMaxSize(),
                  contentPadding = PaddingValues(horizontal = 22.dp, vertical = 22.dp),
                  verticalArrangement = Arrangement.spacedBy(18.dp)
              ) {
                  item { V18BrandLine("READINESS / SAFETY") }
                  item {
                      Column(verticalArrangement = Arrangement.spacedBy(6.dp)) {
                          V18Eyebrow("BEFORE YOU TRAIN")
                          Text("اول، وضعیت بدن.", color = V18Ink,
                              fontSize = 31.sp, fontWeight = FontWeight.ExtraBold)
                          Text("بررسی کوتاه علائم برای تصمیم محتاطانه‌تر.",
                              color = V18Muted, fontSize = 12.sp)
                      }
                  }
                  item {
                      Surface(
                          shape = RoundedCornerShape(22.dp),
                          color = if (red) Color(0xFFFBE9E5)
                              else if (yellow) Color(0xFFFFF2DB) else V18Mint
                      ) {
                          Row(Modifier.fillMaxWidth().padding(19.dp), verticalAlignment = Alignment.Top) {
                              Icon(
                                  if (red) Icons.Default.Warning else Icons.Default.VerifiedUser,
                                  null, tint = if (red) Color(0xFFB45242) else if (yellow)
                                      Color(0xFF9E7228) else V18Forest,
                                  modifier = Modifier.size(24.dp)
                              )
                              Spacer(Modifier.width(12.dp))
                              Column(Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                                  Text(
                                      if (red) "تمرین نکن؛ نیاز به ارزیابی داری"
                                      else if (yellow) "امروز محتاطانه‌تر تمرین کن"
                                      else "علامت هشدار ثبت نشده",
                                      fontSize = 15.sp, fontWeight = FontWeight.ExtraBold, color = V18Ink
                                  )
                                  Text(
                                      if (red) "با گزگز، ضعف یا درد تیرکشنده جدید، یا درد شدید، تمرین را متوقف و برای ارزیابی پزشکی اقدام کن."
                                      else if (yellow) "بار تمرین را سبک‌تر کن و فقط در دامنه بدون درد کار کن."
                                      else "نبود علامت هشدار به معنای تأیید پزشکی نیست. در صورت تغییر علائم تمرین را متوقف کن.",
                                      color = V18Ink, fontSize = 12.sp, lineHeight = 20.sp
                                  )
                              }
                          }
                      }
                  }
                  item { V18SectionHeader("سطح ناراحتی", "بر اساس حس فعلی خودت تنظیم کن") }
                  item { PainCard("درد گردن", neck) { neck = it } }
                  item { PainCard("درد زانوی چپ", knee) { knee = it } }
                  item { V18SectionHeader("علائم هشدار", "اگر تازه ایجاد شده‌اند، جدی بگیر") }
                  item {
                      Surface(shape = RoundedCornerShape(19.dp), color = V18Surface) {
                          Column(Modifier.padding(17.dp), verticalArrangement = Arrangement.spacedBy(7.dp)) {
                              SymptomRow("گزگز یا بی‌حسی جدید دست/بازو", tingling) { tingling = it }
                              HorizontalDivider(color = V18Line)
                              SymptomRow("ضعف جدید دست یا بازو", weakness) { weakness = it }
                              HorizontalDivider(color = V18Line)
                              SymptomRow("درد تیرکشنده از گردن", radiating) { radiating = it }
                          }
                      }
                  }
                  item { Spacer(Modifier.height(8.dp)) }
              }
          }
          KOTLIN

      - name: Verify design integrity and every V1.7 video before compilation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/rebuild/hamed/MainActivity.kt')
          s = p.read_text(encoding='utf-8')
          checks = [
              'private fun V18App()',
              'private fun V18Home(',
              'private fun V18Program(',
              'private fun V18SessionPage(',
              'private fun V18ExercisePage(',
              'private fun V18MediaStage(',
              'private fun V18Progress(',
              'private fun V18SafetyScreen()',
              'store.setLog(exercise.id, weight, reps, rir)',
              'store.setCompleted(session.id, complete)',
              'R.raw.chest_press_side_view',
              'R.raw.seated_row_side_view',
              'R.raw.leg_press_side_view',
              'R.raw.lat_pulldown_side_view',
          ]
          for x in checks:
              if x not in s:
                  raise SystemExit('Regression check failed: ' + x)
          names = (
              'chest_press_real', 'chest_press_side_view',
              'seated_row_real', 'seated_row_side_view',
              'leg_press_real', 'leg_press_side_view',
              'lat_pulldown_real', 'lat_pulldown_side_view',
              'glute_bridge_real',
          )
          for name in names:
              asset = Path('app/src/main/res/raw') / (name + '.mp4')
              if not asset.exists() or asset.stat().st_size < 200_000:
                  raise SystemExit('Video regression: ' + name)
              print(name, asset.stat().st_size)
          print('All nine video assets and V1.8 screens are present.')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Set up Gradle 9.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Build REBUILD V1.8 Android APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          for asset in chest_press_real chest_press_side_view seated_row_real seated_row_side_view leg_press_real leg_press_side_view lat_pulldown_real lat_pulldown_side_view glute_bridge_real; do
            unzip -Z1 app/build/outputs/apk/debug/app-debug.apk | grep -Fxq "res/raw/${asset}.mp4" || { echo "APK is missing ${asset}"; exit 1; }
          done

      - name: Upload REBUILD V1.8 APK
        uses: actions/upload-artifact@v4
        with:
          name: REBUILD-v1.8-visual-renaissance-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
