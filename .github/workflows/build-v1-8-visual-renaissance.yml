name: Build REBUILD V1.8 VISUAL RENAISSANCE APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-v1-8-visual-renaissance.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout V1.7 baseline and redesign workflow
        uses: actions/checkout@v4

      - name: Reconstruct the accepted V1.7 app and all nine real exercise videos
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/rebuild-venv
          /tmp/rebuild-venv/bin/pip install --quiet PyYAML
          /tmp/rebuild-venv/bin/python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          p = Path('.github/workflows/build-v1-7-three-side-views.yml')
          if not p.exists():
              raise SystemExit('V1.7 baseline workflow missing. Do not build with missing media.')
          workflow = yaml.safe_load(p.read_text(encoding='utf-8'))
          steps = workflow['jobs']['build']['steps']
          exact_names = (
              'Rebuild Android project structure',
              'Integrate V1.5 premium exercise UX',
          )
          for name in exact_names:
              options = [s for s in steps if s.get('name') == name]
              if len(options) != 1 or 'run' not in options[0]:
                  raise SystemExit('V1.7 baseline changed unexpectedly: ' + name)
              print('Reusing verified V1.7 assembly stage: ' + name, flush=True)
              subprocess.run(['bash', '-e', '-o', 'pipefail', '-c', options[0]['run']], check=True)
          PY

      - name: Integrate the V1.8 editorial design system and new Compose screens
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/rebuild/hamed/MainActivity.kt')
          s = p.read_text(encoding='utf-8')
          original = '                    RebuildApp()'
          if s.count(original) != 1:
              raise SystemExit('Could not safely switch entry screen to V1.8.')
          s = s.replace(original, '                    V18App()', 1)

          palette = {
              'private val AppBg = Color(0xFFF6F8FB)': 'private val AppBg = Color(0xFFF7F6F2)',
              'private val Primary = Color(0xFF1685F8)': 'private val Primary = Color(0xFF184D42)',
              'private val PrimarySoft = Color(0xFFEAF4FF)': 'private val PrimarySoft = Color(0xFFE6EEE8)',
              'private val Ink = Color(0xFF10213D)': 'private val Ink = Color(0xFF172522)',
              'private val Muted = Color(0xFF718096)': 'private val Muted = Color(0xFF77817A)',
              'private val Border = Color(0xFFE8EDF3)': 'private val Border = Color(0xFFE7E8E0)',
              'private val Success = Color(0xFF16B879)': 'private val Success = Color(0xFF267E63)',
          }
          for previous, replacement in palette.items():
              if s.count(previous) != 1:
                  raise SystemExit('Palette anchor changed: ' + previous)
              s = s.replace(previous, replacement, 1)
          p.write_text(s, encoding='utf-8')
          print('V1.8 app entry point and unified tokens integrated.')

          gradle = Path('app/build.gradle.kts')
          g = gradle.read_text(encoding='utf-8')
          if g.count('versionCode = 8') != 1 or g.count('versionName = "1.7.0"') != 1:
              raise SystemExit('Refusing ambiguous Android version migration.')
          g = g.replace('versionCode = 8', 'versionCode = 9', 1)
          g = g.replace('versionName = "1.7.0"', 'versionName = "1.8.0"', 1)
          gradle.write_text(g, encoding='utf-8')
          PY
          cat >> app/src/main/java/com/rebuild/hamed/MainActivity.kt <<'KOTLIN'
          // REBUILD 1.8 / FORM & FUNCTION
          // Editorial fitness UI layer; compiled into MainActivity.kt by build-v1-8-visual-renaissance.yml.
          // The V1.7 player resources, training data, and SharedPreferences are retained.

          private val V18Bg = Color(0xFFF7F6F2)
          private val V18Ink = Color(0xFF172522)
          private val V18Forest = Color(0xFF184D42)
          private val V18Forest2 = Color(0xFF11372F)
          private val V18Mint = Color(0xFFE6EEE8)
          private val V18Amber = Color(0xFFDE9069)
          private val V18Muted = Color(0xFF77817A)
          private val V18Line = Color(0xFFE7E8E0)
          private val V18Surface = Color.White

          @Composable
          private fun V18App() {
              val context = LocalContext.current
              val store = remember { RebuildStore(context) }
              var tab by rememberSaveable { mutableStateOf(0) }
              var sessionId by rememberSaveable { mutableStateOf<String?>(null) }
              var exerciseId by rememberSaveable { mutableStateOf<String?>(null) }
              val exerciseLookup = remember { sessions.flatMap { it.exercises }.associateBy { it.id } }
              val session = sessions.find { it.id == sessionId }
              val exercise = exerciseLookup[exerciseId]
              val root = exercise == null && session == null

              Scaffold(
                  containerColor = V18Bg,
                  bottomBar = {
                      if (root) {
                          Surface(color = V18Surface, shadowElevation = 5.dp) {
                              Row(
                                  modifier = Modifier.fillMaxWidth().navigationBarsPadding()
                                      .padding(horizontal = 13.dp, vertical = 9.dp),
                                  horizontalArrangement = Arrangement.SpaceBetween
                              ) {
                                  val names = listOf("خانه", "برنامه", "پیشرفت", "ایمنی")
                                  val icons = listOf(
                                      Icons.Default.Home, Icons.Default.CalendarMonth,
                                      Icons.Default.BarChart, Icons.Default.Shield
                                  )
                                  names.forEachIndexed { index, name ->
                                      val selected = tab == index
                                      Column(
                                          Modifier.weight(1f).clip(RoundedCornerShape(15.dp))
                                              .clickable { tab = index }
                                              .padding(vertical = 5.dp),
                                          horizontalAlignment = Alignment.CenterHorizontally,
                                          verticalArrangement = Arrangement.spacedBy(4.dp)
                                      ) {
                                          Box(
                                              Modifier.size(width = 42.dp, height = 31.dp)
                                                  .clip(RoundedCornerShape(11.dp))
                                                  .background(if (selected) V18Mint else Color.Transparent),
                                              contentAlignment = Alignment.Center
                                          ) {
                                              Icon(
                                                  icons[index], contentDescription = null,
                                                  modifier = Modifier.size(21.dp),
                                                  tint = if (selected) V18Forest else V18Muted
                                              )
                                          }
                                          Text(
                                              name, fontSize = 10.sp,
                                              fontWeight = if (selected) FontWeight.Bold else FontWeight.Medium,
                                              color = if (selected) V18Forest else V18Muted
                                          )
                                      }
                                  }
                              }
                          }
                      }
                  }
              ) { padding ->
                  Box(Modifier.fillMaxSize().padding(padding)) {
                      when {
                          exercise != null -> V18ExercisePage(exercise, store) { exerciseId = null }
                          session != null -> V18SessionPage(
                              session, store,
                              onBack = { sessionId = null },
                              onExercise = { exerciseId = it.id }
                          )
                          tab == 0 -> V18Home(store,
                              onStart = {
                                  sessionId = (sessions.firstOrNull { !store.completed(it.id) }
                                      ?: sessions.first()).id
                              },
                              onOpen = { sessionId = it.id }
                          )
                          tab == 1 -> V18Program(store) { sessionId = it.id }
                          tab == 2 -> V18Progress(store)
                          else -> V18SafetyScreen() // Same evidence-based symptom thresholds as V1.7.
                      }
                  }
              }
          }

          @Composable
          private fun V18BrandLine(section: String) {
              Row(
                  Modifier.fillMaxWidth(),
                  verticalAlignment = Alignment.CenterVertically,
                  horizontalArrangement = Arrangement.SpaceBetween
              ) {
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      Box(
                          Modifier.size(37.dp).clip(RoundedCornerShape(11.dp))
                              .background(V18Forest),
                          contentAlignment = Alignment.Center
                      ) {
                          Text("R", fontSize = 21.sp, fontWeight = FontWeight.Black, color = Color.White)
                      }
                      Spacer(Modifier.width(10.dp))
                      Column(verticalArrangement = Arrangement.spacedBy(1.dp)) {
                          Text("REBUILD", color = V18Ink, fontSize = 16.sp,
                              fontWeight = FontWeight.Black, letterSpacing = 1.sp)
                          Text("STRENGTH, REFINED.", color = V18Muted, fontSize = 8.sp,
                              letterSpacing = 1.1.sp)
                      }
                  }
                  Text(section, color = V18Muted, fontSize = 11.sp, fontWeight = FontWeight.SemiBold)
              }
          }

          @Composable
          private fun V18Eyebrow(text: String, color: Color = V18Muted) {
              Text(text, fontSize = 10.sp, fontWeight = FontWeight.Bold,
                  color = color, letterSpacing = 0.6.sp)
          }

          @Composable
          private fun V18SectionHeader(title: String, sub: String? = null) {
              Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                  Column(Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(3.dp)) {
                      Text(title, fontSize = 20.sp, color = V18Ink, fontWeight = FontWeight.ExtraBold)
                      if (sub != null) Text(sub, fontSize = 11.sp, color = V18Muted)
                  }
                  Box(Modifier.width(26.dp).height(2.dp).background(V18Amber))
              }
          }

          @Composable
          private fun V18Home(
              store: RebuildStore,
              onStart: () -> Unit,
              onOpen: (Session) -> Unit
          ) {
              val done = sessions.count { store.completed(it.id) }
              val next = sessions.firstOrNull { !store.completed(it.id) }
              LazyColumn(
                  modifier = Modifier.fillMaxSize(),
                  contentPadding = PaddingValues(horizontal = 22.dp, vertical = 22.dp),
                  verticalArrangement = Arrangement.spacedBy(23.dp)
              ) {
                  item { V18BrandLine("YOUR TRAINING STUDIO") }
                  item {
                      Column(verticalArrangement = Arrangement.spacedBy(4.dp)) {
                          V18Eyebrow("REBUILD  /  PERSONAL TRAINING")
                          Text("قدرت، با برنامه.", color = V18Ink, fontWeight = FontWeight.ExtraBold,
                              fontSize = 31.sp, lineHeight = 41.sp)
                          Text("هر جلسه یک قدم دقیق‌تر به جلو.", color = V18Muted, fontSize = 13.sp)
                      }
                  }
                  item {
                      Surface(
                          modifier = Modifier.fillMaxWidth(),
                          shape = RoundedCornerShape(25.dp), color = V18Forest2
                      ) {
                          Column(Modifier.padding(24.dp), verticalArrangement = Arrangement.spacedBy(16.dp)) {
                              Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                                  Row(verticalAlignment = Alignment.CenterVertically) {
                                      Box(Modifier.size(7.dp).clip(CircleShape).background(V18Amber))
                                      Spacer(Modifier.width(8.dp))
                                      V18Eyebrow(if (next == null) "THIS WEEK / COMPLETE" else "YOUR NEXT SESSION", Color(0xFFB9D1C5))
                                  }
                                  Spacer(Modifier.weight(1f))
                                  Text("${done}/3", color = Color(0xFFCADBD1),
                                      fontSize = 13.sp, fontWeight = FontWeight.Bold)
                              }
                              if (next != null) {
                                  Text("SESSION ${next.id}", fontSize = 38.sp,
                                      lineHeight = 45.sp, color = Color.White,
                                      fontWeight = FontWeight.Black, letterSpacing = 0.4.sp)
                                  Column(verticalArrangement = Arrangement.spacedBy(4.dp)) {
                                      Text(next.day + "  ·  " + next.title,
                                          color = Color.White, fontSize = 15.sp,
                                          fontWeight = FontWeight.SemiBold)
                                      Text("${next.exercises.size} حرکت  /  ۲ ست برای هر حرکت",
                                          color = Color(0xFFC7D6CF), fontSize = 11.sp)
                                  }
                              } else {
                                  Text("هفته تکمیل شد", fontSize = 26.sp,
                                      color = Color.White, fontWeight = FontWeight.ExtraBold)
                                  Text("تمام سه جلسه برنامه‌ریزی‌شده ثبت شده‌اند.",
                                      color = Color(0xFFC7D6CF), fontSize = 12.sp)
                              }
                              Button(
                                  onClick = onStart, modifier = Modifier.fillMaxWidth().height(52.dp),
                                  shape = RoundedCornerShape(14.dp),
                                  colors = ButtonDefaults.buttonColors(containerColor = Color.White,
                                      contentColor = V18Forest2)
                              ) {
                                  Text(if (next == null) "مشاهده برنامه تمرینی" else "شروع جلسه بعدی",
                                      fontWeight = FontWeight.Bold, fontSize = 14.sp)
                                  Spacer(Modifier.width(10.dp))
                                  Icon(Icons.Default.ArrowBack, null, Modifier.size(19.dp))
                              }
                          }
                      }
                  }
                  item {
                      Row(horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                          V18MetricTile("${done} / 3", "جلسه ثبت‌شده", Modifier.weight(1f))
                          V18MetricTile("05", "حرکت دارای ویدیو", Modifier.weight(1f))
                      }
                  }
                  item { V18SectionHeader("برنامه هفتگی", "سه جلسه تمرینی با تمرکز روی کیفیت حرکت") }
                  items(sessions) { session ->
                      V18SessionLine(session, store.completed(session.id),
                          onClick = { onOpen(session) })
                  }
                  item { Spacer(Modifier.height(12.dp)) }
              }
          }

          @Composable
          private fun V18MetricTile(value: String, label: String, modifier: Modifier = Modifier) {
              Surface(modifier = modifier, shape = RoundedCornerShape(18.dp), color = V18Surface) {
                  Column(Modifier.padding(18.dp), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                      Text(value, color = V18Forest, fontSize = 25.sp,
                          fontWeight = FontWeight.Black)
                      Text(label, color = V18Muted, fontSize = 11.sp)
                  }
              }
          }

          @Composable
          private fun V18SessionLine(session: Session, complete: Boolean, onClick: () -> Unit) {
              Surface(
                  modifier = Modifier.fillMaxWidth().clickable(onClick = onClick),
                  color = V18Surface, shape = RoundedCornerShape(17.dp)
              ) {
                  Row(Modifier.fillMaxWidth().padding(15.dp), verticalAlignment = Alignment.CenterVertically) {
                      Box(
                          modifier = Modifier.size(49.dp).clip(RoundedCornerShape(14.dp))
                              .background(if (complete) V18Mint else V18Bg),
                          contentAlignment = Alignment.Center
                      ) {
                          Text(session.id, fontWeight = FontWeight.Black,
                              color = V18Forest, fontSize = 24.sp)
                      }
                      Spacer(Modifier.width(14.dp))
                      Column(Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(4.dp)) {
                          Text(session.title, fontSize = 13.sp,
                              fontWeight = FontWeight.ExtraBold, color = V18Ink)
                          Text("${session.day}   •   ${session.exercises.size} حرکت",
                              fontSize = 11.sp, color = V18Muted)
                      }
                      Icon(
                          if (complete) Icons.Default.CheckCircle else Icons.Default.ChevronLeft,
                          null, Modifier.size(22.dp),
                          tint = if (complete) V18Forest else V18Muted
                      )
                  }
              }
          }

          @Composable
          private fun V18Program(store: RebuildStore, onOpen: (Session) -> Unit) {
              LazyColumn(
                  modifier = Modifier.fillMaxSize(),
                  contentPadding = PaddingValues(horizontal = 22.dp, vertical = 22.dp),
                  verticalArrangement = Arrangement.spacedBy(19.dp)
              ) {
                  item { V18BrandLine("THE PROGRAM") }
                  item {
                      Column(verticalArrangement = Arrangement.spacedBy(5.dp)) {
                          V18Eyebrow("THREE DAYS / ONE DIRECTION")
                          Text("برنامه تمرینی", color = V18Ink, fontWeight = FontWeight.ExtraBold,
                              fontSize = 30.sp)
                          Text("سه جلسه در هفته؛ پیشروی با کنترل و استمرار.",
                              color = V18Muted, fontSize = 12.sp)
                      }
                  }
                  item {
                      Surface(shape = RoundedCornerShape(20.dp), color = V18Mint,
                          modifier = Modifier.fillMaxWidth()) {
                          Row(Modifier.padding(19.dp), verticalAlignment = Alignment.CenterVertically) {
                              Icon(Icons.Default.AutoAwesome, null, tint = V18Forest)
                              Spacer(Modifier.width(10.dp))
                              Text("هدف: تمرین باکیفیت، فرم صحیح و پیشرفت تدریجی",
                                  fontSize = 12.sp, color = V18Forest,
                                  fontWeight = FontWeight.SemiBold)
                          }
                      }
                  }
                  items(sessions) { session ->
                      V18SessionLine(session, store.completed(session.id)) { onOpen(session) }
                  }
                  item { Spacer(Modifier.height(10.dp)) }
              }
          }

          @Composable
          private fun V18Back(onBack: () -> Unit, caption: String) {
              Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                  Surface(
                      onClick = onBack, shape = RoundedCornerShape(12.dp),
                      color = V18Surface, modifier = Modifier.size(42.dp)
                  ) {
                      Box(contentAlignment = Alignment.Center) {
                          Icon(Icons.Default.ArrowForward, "بازگشت", tint = V18Ink)
                      }
                  }
                  Spacer(Modifier.width(13.dp))
                  V18Eyebrow(caption)
                  Spacer(Modifier.weight(1f))
                  Text("REBUILD", color = V18Forest,
                      fontSize = 11.sp, letterSpacing = 1.sp,
                      fontWeight = FontWeight.Black)
              }
          }

          @Composable
          private fun V18SessionPage(
              session: Session,
              store: RebuildStore,
              onBack: () -> Unit,
              onExercise: (Exercise) -> Unit
          ) {
              var complete by remember(session.id) { mutableStateOf(store.completed(session.id)) }
              LazyColumn(
                  Modifier.fillMaxSize(),
                  contentPadding = PaddingValues(horizontal = 22.dp, vertical = 21.dp),
                  verticalArrangement = Arrangement.spacedBy(17.dp)
              ) {
                  item { V18Back(onBack, "WORKOUT DETAILS") }
                  item {
                      Column(verticalArrangement = Arrangement.spacedBy(6.dp)) {
                          V18Eyebrow("${session.day}  /  ${session.exercises.size} EXERCISES")
                          Text("SESSION ${session.id}", color = V18Ink,
                              fontWeight = FontWeight.Black, fontSize = 36.sp)
                          Text(session.title, color = V18Forest,
                              fontWeight = FontWeight.SemiBold, fontSize = 15.sp)
                          Text(session.subtitle, color = V18Muted, fontSize = 12.sp)
                      }
                  }
                  item { V18SectionHeader("حرکت‌های امروز", "برای نمایش ویدیو روی هر حرکت بزن") }
                  items(session.exercises.size) { i ->
                      val ex = session.exercises[i]
                      Surface(
                          shape = RoundedCornerShape(17.dp),
                          color = V18Surface,
                          modifier = Modifier.fillMaxWidth().clickable { onExercise(ex) }
                      ) {
                          Row(Modifier.padding(horizontal = 15.dp, vertical = 14.dp),
                              verticalAlignment = Alignment.CenterVertically) {
                              Text("${(i + 1).toString().padStart(2, '0')}",
                                  fontSize = 17.sp, color = V18Amber,
                                  fontWeight = FontWeight.Black)
                              Spacer(Modifier.width(14.dp))
                              Column(Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(3.dp)) {
                                  Text(ex.en, color = V18Ink, fontSize = 14.sp,
                                      fontWeight = FontWeight.Bold)
                                  Text("${ex.fa}   ·   ${ex.sets} ست × ${ex.reps}",
                                      color = V18Muted, fontSize = 11.sp)
                              }
                              Icon(if (v15MediaFor(ex.id) != null) Icons.Default.PlayCircle
                                  else Icons.Default.ChevronLeft, null,
                                  tint = V18Forest, modifier = Modifier.size(23.dp))
                          }
                      }
                  }
                  item {
                      Button(
                          onClick = { complete = !complete; store.setCompleted(session.id, complete) },
                          modifier = Modifier.fillMaxWidth().height(55.dp),
                          shape = RoundedCornerShape(15.dp),
                          colors = ButtonDefaults.buttonColors(containerColor = V18Forest)
                      ) {
                          Icon(if (complete) Icons.Default.CheckCircle else Icons.Default.Check, null)
                          Spacer(Modifier.width(10.dp))
                          Text(if (complete) "جلسه تکمیل شد · لغو ثبت" else "ثبت پایان جلسه",
                              fontWeight = FontWeight.Bold)
                      }
                  }
              }
          }

          @Composable
          private fun V18ExercisePage(
              exercise: Exercise,
              store: RebuildStore,
              onBack: () -> Unit
          ) {
              var weight by rememberSaveable(exercise.id) { mutableStateOf(store.weight(exercise.id)) }
              var reps by rememberSaveable(exercise.id) {
                  mutableStateOf(store.reps(exercise.id).ifBlank { exercise.reps.substringBefore('–') })
              }
              var rir by rememberSaveable(exercise.id) { mutableStateOf(store.rir(exercise.id)) }
              var saved by remember(exercise.id) { mutableStateOf(false) }
              var seconds by rememberSaveable(exercise.id) { mutableIntStateOf(exercise.rest) }
              var timerRunning by rememberSaveable(exercise.id) { mutableStateOf(false) }
              var showMistakes by rememberSaveable(exercise.id) { mutableStateOf(false) }
              val media = v15MediaFor(exercise.id)

              LaunchedEffect(timerRunning, seconds) {
                  if (timerRunning && seconds > 0) { delay(1000); seconds-- }
                  else if (seconds <= 0) timerRunning = false
              }

              LazyColumn(
                  modifier = Modifier.fillMaxSize(),
                  contentPadding = PaddingValues(horizontal = 19.dp, vertical = 19.dp),
                  verticalArrangement = Arrangement.spacedBy(17.dp)
              ) {
                  item { V18Back(onBack, "MOVEMENT STUDIO") }
                  item {
                      Column(verticalArrangement = Arrangement.spacedBy(7.dp)) {
                          V18Eyebrow(v15PatternFor(exercise.id), V18Forest)
                          Text(exercise.en, color = V18Ink, fontSize = 29.sp,
                              lineHeight = 35.sp, fontWeight = FontWeight.Black)
                          Text(exercise.fa + "   /   " + v15MusclesFor(exercise.id),
                              color = V18Muted, fontSize = 12.sp, lineHeight = 19.sp)
                      }
                  }
                  item {
                      Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                          V18SmallStat("${exercise.sets}", "ست", Modifier.weight(1f))
                          V18SmallStat(exercise.reps, "تکرار", Modifier.weight(1f))
                          V18SmallStat("${exercise.rest}s", "استراحت", Modifier.weight(1f))
                      }
                  }
                  item {
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(9.dp)) {
                          V18ModeButton("اجرای صحیح", !showMistakes, Modifier.weight(1f)) { showMistakes = false }
                          V18ModeButton("اشتباهات رایج", showMistakes, Modifier.weight(1f)) { showMistakes = true }
                      }
                  }
                  if (!showMistakes) {
                      item {
                          if (media != null) V18MediaStage(exercise.id, media)
                          else Surface(shape = RoundedCornerShape(22.dp), color = V18Mint) {
                              Column(Modifier.fillMaxWidth().padding(28.dp),
                                  verticalArrangement = Arrangement.spacedBy(8.dp)) {
                                  Icon(Icons.Default.VideocamOff, null, tint = V18Forest)
                                  Text("ویدیوی این حرکت هنوز آماده نیست",
                                      color = V18Ink, fontWeight = FontWeight.Bold)
                                  Text("در حال حاضر از راهنمای فرم صحیح زیر استفاده کن.",
                                      color = V18Muted, fontSize = 12.sp)
                              }
                          }
                      }
                      item { V18Coaching(exercise) }
                  } else {
                      item {
                          Surface(color = V18Surface, shape = RoundedCornerShape(19.dp)) {
                              Column(Modifier.fillMaxWidth().padding(18.dp),
                                  verticalArrangement = Arrangement.spacedBy(14.dp)) {
                                  V18Eyebrow("TECHNIQUE / COMMON ERRORS", V18Amber)
                                  Text("اشتباه‌هایی که باید بشناسی",
                                      color = V18Ink, fontWeight = FontWeight.Bold, fontSize = 18.sp)
                                  v15MistakesFor(exercise.id).forEachIndexed { index, pair ->
                                      Row(verticalAlignment = Alignment.Top) {
                                          Box(Modifier.size(31.dp).clip(RoundedCornerShape(10.dp))
                                              .background(Color(0xFFFFEEE7)), contentAlignment = Alignment.Center) {
