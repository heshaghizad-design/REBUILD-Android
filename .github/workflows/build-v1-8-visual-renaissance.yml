          @Composable
          private fun V18MediaStage(exerciseId: String, media: V15ExerciseMedia) {
              val context = LocalContext.current
              var side by rememberSaveable(exerciseId) { mutableStateOf(false) }
              var isPlaying by rememberSaveable(exerciseId) { mutableStateOf(true) }
              var speed by rememberSaveable(exerciseId) { mutableFloatStateOf(1f) }
              var fullscreen by remember { mutableStateOf(false) }
              var pos by remember { mutableLongStateOf(0L) }
              val selectedRes = if (side) media.sideVideo ?: media.mainVideo else media.mainVideo
              val player = remember(exerciseId) {
                  ExoPlayer.Builder(context).build().apply {
                      repeatMode = Player.REPEAT_MODE_ONE
                      volume = 0f
                  }
              }
              DisposableEffect(player) { onDispose { player.release() } }
              LaunchedEffect(player, selectedRes) {
                  player.setMediaItem(MediaItem.fromUri(
                      Uri.parse("android.resource://${context.packageName}/$selectedRes")))
                  player.prepare()
                  pos = 0
              }
              LaunchedEffect(player, selectedRes, speed, isPlaying) {
                  player.setPlaybackSpeed(speed)
                  player.playWhenReady = isPlaying
              }
              LaunchedEffect(player, selectedRes) {
                  while (true) { pos = player.currentPosition; delay(300) }
              }
              val duration = player.duration.takeIf { it > 0L } ?: 0L
              val progress = if (duration > 0L) (pos.toFloat() / duration).coerceIn(0f, 1f) else 0f

              Column(verticalArrangement = Arrangement.spacedBy(11.dp)) {
                  Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                      V18Eyebrow("VIDEO TECHNIQUE  /  01", V18Forest)
                      Spacer(Modifier.weight(1f))
                      Text("OFFLINE", color = V18Muted, fontSize = 10.sp,
                          letterSpacing = 1.sp, fontWeight = FontWeight.Bold)
                  }
                  if (media.sideVideo != null) {
                      Surface(color = V18Surface, shape = RoundedCornerShape(13.dp)) {
                          Row(Modifier.padding(5.dp), horizontalArrangement = Arrangement.spacedBy(5.dp)) {
                              listOf("نمای اصلی", "نمای زاویه‌دار").forEachIndexed { i, title ->
                                  val selected = (i == 1) == side
                                  Surface(
                                      onClick = { side = i == 1; isPlaying = true },
                                      color = if (selected) V18Forest else V18Surface,
                                      shape = RoundedCornerShape(9.dp),
                                      modifier = Modifier.weight(1f)
                                  ) {
                                      Box(Modifier.padding(vertical = 10.dp), contentAlignment = Alignment.Center) {
                                          Text(title, fontSize = 12.sp, fontWeight = FontWeight.Bold,
                                              color = if (selected) Color.White else V18Muted)
                                      }
                                  }
                              }
                          }
                      }
                  }
                  Surface(color = V18Forest2, shape = RoundedCornerShape(20.dp)) {
                      Column {
                          Box(Modifier.fillMaxWidth().aspectRatio(16f / 10f)) {
                              if (!fullscreen) V18PlayerSurface(player, Modifier.fillMaxSize())
                          }
                          Slider(
                              value = progress,
                              onValueChange = { frac -> if (duration > 0) player.seekTo((duration * frac).toLong()) },
                              modifier = Modifier.fillMaxWidth().padding(horizontal = 10.dp),
                              colors = SliderDefaults.colors(
                                  thumbColor = V18Amber, activeTrackColor = V18Amber,
                                  inactiveTrackColor = Color(0xFF49635A)
                              )
                          )
                          Row(Modifier.fillMaxWidth().padding(start = 10.dp, end = 10.dp, bottom = 7.dp),
                              verticalAlignment = Alignment.CenterVertically) {
                              IconButton(onClick = { isPlaying = !isPlaying }) {
                                  Icon(if (isPlaying) Icons.Default.Pause else Icons.Default.PlayArrow,
                                      if (isPlaying) "توقف" else "پخش", tint = Color.White)
                              }
                              IconButton(onClick = { player.seekTo(0L); isPlaying = true }) {
                                  Icon(Icons.Default.Replay, "شروع مجدد", tint = Color.White)
                              }
                              Spacer(Modifier.weight(1f))
                              TextButton(onClick = { speed = if (speed == .5f) 1f else .5f }) {
                                  Text(if (speed == .5f) "0.5×" else "1×",
                                      color = Color.White, fontWeight = FontWeight.Bold)
                              }
                              IconButton(onClick = { fullscreen = true }) {
                                  Icon(Icons.Default.Fullscreen, "تمام صفحه", tint = Color.White)
                              }
                          }
                      }
                  }
                  if (side) {
                      val note = when (exerciseId) {
                          "chest_press" -> "کلیپ از زاویه مایل و دستگاه متفاوت است؛ به وضعیت گردن و شانه توجه کن."
                          "leg_press" -> "نوع دستگاه در نمای دوم متفاوت است؛ دامنه زانو و پایداری لگن را بررسی کن."
                          "seated_row" -> "زاویه مایل کشش؛ تنه ثابت و گردن هم‌راستای ستون فقرات بماند."
                          "lat_pulldown" -> "زاویه مایل لت جلو؛ مسیر میله جلوی بدن و گردن خنثی بماند."
                          else -> "نما و تجهیزات ممکن است با دستگاه باشگاه متفاوت باشند."
                      }
                      Text(note, color = V18Muted, fontSize = 11.sp, lineHeight = 18.sp)
                  }
              }

              if (fullscreen) {
                  Dialog(
                      onDismissRequest = { fullscreen = false },
                      properties = DialogProperties(usePlatformDefaultWidth = false)
                  ) {
                      Column(Modifier.fillMaxSize().background(V18Forest2),
                          verticalArrangement = Arrangement.Center) {
                          Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.End) {
                              IconButton(onClick = { fullscreen = false }) {
                                  Icon(Icons.Default.Close, "بستن", tint = Color.White)
                              }
                          }
                          V18PlayerSurface(player, Modifier.fillMaxWidth().aspectRatio(16f / 9f))
                          Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.Center,
                              verticalAlignment = Alignment.CenterVertically) {
                              IconButton(onClick = { isPlaying = !isPlaying }) {
                                  Icon(if (isPlaying) Icons.Default.Pause else Icons.Default.PlayArrow,
                                      null, tint = Color.White)
                              }
                              IconButton(onClick = { player.seekTo(0L); isPlaying = true }) {
                                  Icon(Icons.Default.Replay, null, tint = Color.White)
                              }
                          }
                      }
                  }
              }
          }

