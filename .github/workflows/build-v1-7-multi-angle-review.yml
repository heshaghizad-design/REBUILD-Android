name: REBUILD V1.7 Three-Exercise Angle Review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v1-7-multi-angle-review.yml'

jobs:
  review-side-angle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Prepare preview tools
        shell: bash
        run: |
          set -euo pipefail
          # Ubuntu runners do not consistently include FFmpeg. Install it when absent.
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          mkdir -p angle-review/previews angle-review/frames

      - name: Download candidates and render angle contact sheets
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/review.py <<'PY'
          import json
          import os
          import re
          import subprocess
          import urllib.request
          from pathlib import Path

          root = Path('angle-review')
          previews = root / 'previews'
          frames = root / 'frames'
          previews.mkdir(parents=True, exist_ok=True)
          frames.mkdir(parents=True, exist_ok=True)

          # All clips are discovery candidates. Do NOT mark any as a verified side angle
          # until the rendered contact sheets have been checked visually.
          candidates = [
              ('row_4367635', 'https://www.pexels.com/download/video/4367635/',
               'https://www.pexels.com/video/a-man-doing-a-seated-cable-row-4367635/'),
              ('row_30916502', 'https://www.pexels.com/download/video/30916502/',
               'https://www.pexels.com/video/intense-gym-workout-with-cable-machine-30916502/'),
              ('row_35585654', 'https://www.pexels.com/download/video/35585654/',
               'https://www.pexels.com/video/man-exercising-on-cable-machine-in-gym-35585654/'),
              ('row_4367642', 'https://www.pexels.com/download/video/4367642/',
               'https://www.pexels.com/video/a-man-doing-a-seated-cable-row-4367642/'),
              ('leg_36457367', 'https://www.pexels.com/download/video/36457367/',
               'https://www.pexels.com/video/man-exercising-on-leg-press-machine-at-gym-36457367/'),
              ('leg_35585571', 'https://www.pexels.com/download/video/35585571/',
               'https://www.pexels.com/video/man-performing-leg-workout-on-gym-equipment-35585571/'),
              ('leg_6540310', 'https://www.pexels.com/download/video/6540310/',
               'https://www.pexels.com/video/a-woman-sitting-on-a-machine-in-a-gym-6540310/'),
              ('leg_32239225', 'https://www.pexels.com/download/video/32239225/',
               'https://www.pexels.com/video/dynamic-leg-press-workout-in-modern-gym-32239225/'),
              ('lat_35585703', 'https://www.pexels.com/download/video/35585703/',
               'https://www.pexels.com/video/man-working-out-on-gym-equipment-35585703/'),
              ('lat_35585639', 'https://www.pexels.com/download/video/35585639/',
               'https://www.pexels.com/video/focused-gym-workout-with-lat-pulldown-35585639/'),
              ('lat_36871349', 'https://www.pexels.com/download/video/36871349/',
               'https://www.pexels.com/video/young-woman-exercising-on-lat-pulldown-machine-36871349/'),
              ('lat_35585697', 'https://www.pexels.com/download/video/35585697/',
               'https://www.pexels.com/video/intense-gym-workout-with-lat-pulldown-35585697/'),
          ]

          def run(*argv, check=True):
              return subprocess.run(argv, capture_output=True, text=True, check=check)

          def download(url, path):
              res = run('curl', '-fLsS', '--connect-timeout', '18', '--max-time', '110',
                        '--retry', '1', '-A', 'Mozilla/5.0', url, '-o', str(path), check=False)
              return res.returncode == 0 and path.exists() and path.stat().st_size > 150000

          results = []
          for name, url, page in candidates:
              entry = {'id':name, 'source_page':page, 'state':'failed'}
              original = root / (name + '_source.mp4')
              try:
                  download_url = url
                  entry['video_url'] = download_url
                  if not download(download_url, original):
                      raise RuntimeError('Download failed or was smaller than 150 KB')

                  probe = run('ffprobe', '-v', 'error', '-select_streams', 'v:0',
                              '-show_entries', 'format=duration:stream=width,height,codec_name',
                              '-of', 'json', str(original))
                  info = json.loads(probe.stdout)
                  duration = float(info.get('format', {}).get('duration', 0))
                  if duration < 3:
                      raise RuntimeError('Not a valid video or duration too short')
                  entry['duration_seconds'] = round(duration, 2)
                  entry['video_streams'] = info.get('streams', [])
                  snapshots = []
                  for idx, frac in enumerate((0.15, 0.5, 0.85), 1):
                      shot = frames / f'{name}_{idx}.jpg'
                      run('ffmpeg', '-y', '-v', 'error', '-ss', str(duration * frac),
                          '-i', str(original), '-frames:v', '1',
                          '-vf', 'scale=480:270:force_original_aspect_ratio=decrease,pad=480:270:(ow-iw)/2:(oh-ih)/2',
                          str(shot))
                      snapshots.append(shot)
                  sheet = root / f'{name}_angle_contact_sheet.jpg'
                  run('ffmpeg', '-y', '-v', 'error',
                      '-i', str(snapshots[0]), '-i', str(snapshots[1]), '-i', str(snapshots[2]),
                      '-filter_complex', 'hstack=inputs=3', '-frames:v', '1', str(sheet))
                  clip = previews / (name + '_preview.mp4')
                  run('ffmpeg', '-y', '-v', 'error', '-i', str(original), '-t', '16',
                      '-vf', 'scale=640:-2', '-r', '24', '-c:v', 'libx264',
                      '-preset', 'veryfast', '-crf', '29', '-pix_fmt', 'yuv420p', '-an',
                      '-movflags', '+faststart', str(clip))
                  entry['state'] = 'downloaded_and_frames_extracted'
                  entry['angle_not_verified'] = True
              except Exception as exc:
                  entry['error'] = str(exc)
              finally:
                  original.unlink(missing_ok=True)
                  results.append(entry)
                  print(name, entry['state'], entry.get('error', ''))

          (root / 'source_manifest.json').write_text(json.dumps(results, indent=2, ensure_ascii=False))
          good = [x for x in results if x['state'] == 'downloaded_and_frames_extracted']
          (root / 'READ_ME_FIRST.txt').write_text(
              'REBUILD V1.7: SEATED ROW, LEG PRESS AND LAT PULLDOWN ANGLE REVIEW\n\n'
              'Candidates: row_ = Seated Row; leg_ = Leg Press; lat_ = Lat Pulldown.\n'
              'Review JPG files named *_angle_contact_sheet.jpg.\n'
              'They show frames from roughly 15%, 50% and 85% of each candidate clip.\n'
              'All contact sheets must be visually inspected before claiming a side view.\n'
              'Preview MP4s are in previews/. Source metadata is in source_manifest.json.\n'
              'Downloaded candidates: ' + str(len(good)) + '/' + str(len(results)) + '\n'
              'Do not use a candidate in the production app until verified.\n',
              encoding='utf-8'
          )
          print('PREVIEW_RESULT:', len(good), 'candidate videos generated')
          if not good:
              raise SystemExit('No playable candidate videos were downloaded; inspect source_manifest.json and links.')
          PY
          python3 /tmp/review.py

      - name: Upload candidate frames and short review clips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: REBUILD-v1.7-angle-candidate-previews
          path: angle-review/
          retention-days: 30
          if-no-files-found: error
