name: Build REBUILD APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild Android project structure
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/rebuild/hamed
          mkdir -p app/src/main/res/drawable-nodpi
          mkdir -p app/src/main/res/values

          cp MainActivity.kt app/src/main/java/com/rebuild/hamed/MainActivity.kt
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml

          cp strings.xml app/src/main/res/values/strings.xml
          cp styles.xml app/src/main/res/values/styles.xml

          cp chest_press_start.png app/src/main/res/drawable-nodpi/chest_press_start.png
          cp chest_press_press.png app/src/main/res/drawable-nodpi/chest_press_press.png
          cp muscles_chest.png app/src/main/res/drawable-nodpi/muscles_chest.png
          cp mistake_head.png app/src/main/res/drawable-nodpi/mistake_head.png
          cp mistake_shrug.png app/src/main/res/drawable-nodpi/mistake_shrug.png
          cp mistake_elbow.png app/src/main/res/drawable-nodpi/mistake_elbow.png

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "REBUILD"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "9.0.0" apply false
              id("org.jetbrains.kotlin.android") version "2.2.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.2.20" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          android.builtInKotlin=false
          android.newDsl=false
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.rebuild.hamed"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.rebuild.hamed"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 1
                  versionName = "1.0"
              }

              buildFeatures {
                  compose = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2025.09.01")
              implementation(composeBom)

              implementation("androidx.core:core-ktx:1.17.0")
              implementation("androidx.activity:activity-compose:1.11.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.9.3")

              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: REBUILD-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
