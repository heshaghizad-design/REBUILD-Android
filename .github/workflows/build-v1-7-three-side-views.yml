name: Build REBUILD V1.7 THREE SIDE VIEWS APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-v1-7-three-side-views.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild Android project structure
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/java/com/rebuild/hamed
          mkdir -p app/src/main/res/drawable-nodpi
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/raw

          cp MainActivity.kt app/src/main/java/com/rebuild/hamed/MainActivity.kt
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp strings.xml app/src/main/res/values/strings.xml
          cp styles.xml app/src/main/res/values/styles.xml

          cp chest_press_start.png app/src/main/res/drawable-nodpi/chest_press_start.png
          cp chest_press_press.png app/src/main/res/drawable-nodpi/chest_press_press.png
          cp muscles_chest.png app/src/main/res/drawable-nodpi/muscles_chest.png
          cp mistake_head.png app/src/main/res/drawable-nodpi/mistake_head.png
          cp mistake_shrug.png app/src/main/res/drawable-nodpi/mistake_shrug.png
          cp mistake_elbow.png app/src/main/res/drawable-nodpi/mistake_elbow.png

          echo "Downloading real chest press video..."

          PRIMARY_VIDEO="https://assets.mixkit.co/active_storage/video_items/100538/1725384701/100538-video-720.mp4"
          FALLBACK_VIDEO="https://assets.mixkit.co/videos/preview/mixkit-man-using-chest-press-machine-at-gym-100534-large.mp4"

          if ! curl -fL --retry 3 --retry-delay 2 \
              -A "Mozilla/5.0" \
              "$PRIMARY_VIDEO" \
              -o app/src/main/res/raw/chest_press_real.mp4; then

            echo "Primary video failed. Trying fallback..."

            curl -fL --retry 3 --retry-delay 2 \
              -A "Mozilla/5.0" \
              "$FALLBACK_VIDEO" \
              -o app/src/main/res/raw/chest_press_real.mp4
          fi

          VIDEO_SIZE=$(stat -c%s app/src/main/res/raw/chest_press_real.mp4)
          echo "Downloaded video size: $VIDEO_SIZE bytes"

          if [ "$VIDEO_SIZE" -lt 500000 ]; then
            echo "Downloaded file is too small to be a valid exercise video."
            exit 1
          fi

          file app/src/main/res/raw/chest_press_real.mp4 || true

          echo "Downloading verified exercise videos..."

          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

          fetch_video() {
            NAME="$1"
            URL="$2"
            OUT="app/src/main/res/raw/${NAME}.mp4"
            TMP="app/src/main/res/raw/${NAME}_source.mp4"

            echo "Downloading ${NAME}..."
            curl -fL --retry 4 --retry-delay 2 \
              -A "Mozilla/5.0" \
              "$URL" \
              -o "$TMP"

            ffmpeg -y \
              -i "$TMP" \
              -t 12 \
              -r 30 \
              -vf "scale='if(gt(iw,ih),min(1280,iw),-2)':'if(gt(iw,ih),-2,min(1280,ih))'" \
              -c:v libx264 \
              -preset veryfast \
              -crf 24 \
              -pix_fmt yuv420p \
              -an \
              -movflags +faststart \
              "$OUT"

            rm -f "$TMP"

            SIZE=$(stat -c%s "$OUT")
            echo "${NAME} optimized size: ${SIZE} bytes"

            if [ "$SIZE" -lt 200000 ]; then
              echo "${NAME} video is unexpectedly small."
              exit 1
            fi
          }

          fetch_video \
            "seated_row_real" \
            "https://www.pexels.com/download/video/35585654/"

          fetch_video \
            "leg_press_real" \
            "https://www.pexels.com/download/video/35585547/"

          fetch_video \
            "lat_pulldown_real" \
            "https://www.pexels.com/download/video/35585699/"

          fetch_video \
            "glute_bridge_real" \
            "https://www.pexels.com/download/video/6525487/"

          # V1.6: Pexels 34543872, visually reviewed and user-approved.
          # This is an oblique/three-quarter angle and uses a different machine.
          # It is not a 90-degree profile view or a mistake-demonstration.
          echo "Downloading Chest Press angled view (Pexels 34543872)..."
          SIDE_SOURCE="app/src/main/res/raw/chest_press_side_source.mp4"
          SIDE_FINAL="app/src/main/res/raw/chest_press_side_view.mp4"

          curl -fL --retry 4 --retry-delay 2 --connect-timeout 25 \
            -A "Mozilla/5.0" \
            "https://www.pexels.com/download/video/34543872/" \
            -o "$SIDE_SOURCE"

          # Verify that the downloaded file is a playable video before packaging.
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,width,height \
            -of default=noprint_wrappers=1 "$SIDE_SOURCE"

          ffmpeg -y -hide_banner -loglevel error \
            -i "$SIDE_SOURCE" \
            -t 10 \
            -vf "scale=1280:-2" \
            -r 24 \
            -c:v libx264 -preset veryfast -crf 23 \
            -pix_fmt yuv420p -an -movflags +faststart \
            "$SIDE_FINAL"

          rm -f "$SIDE_SOURCE"

          SIDE_SIZE=$(stat -c%s "$SIDE_FINAL")
          echo "Chest Press side-angle video: $SIDE_SIZE bytes"
          if [ "$SIDE_SIZE" -lt 200000 ]; then
            echo "ERROR: Side-angle video is too small."
            exit 1
          fi

          # V1.7: three additional perspective clips reviewed by comparing
          # 15%, 50%, and 85% frames across 12 Pexels candidates.
          # These are not all perfect 90-degree profile views.
          fetch_video \
            "seated_row_side_view" \
            "https://www.pexels.com/download/video/4367642/"

          fetch_video \
            "leg_press_side_view" \
            "https://www.pexels.com/download/video/6540310/"

          fetch_video \
            "lat_pulldown_side_view" \
            "https://www.pexels.com/download/video/36871349/"

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("app/src/main/java/com/rebuild/hamed/MainActivity.kt")
          s = p.read_text(encoding="utf-8")

          def enable_video_for(var_name):
              pattern = rf"(private val {var_name} = Exercise\(\n.*?)(\n\))"
              match = re.search(pattern, s, re.S)
              if not match:
                  raise SystemExit(f"Exercise block not found: {var_name}")

              block = match.group(1)
              if "animated = true" in block:
                  return

              new_block = block.rstrip() + ",\n    true"
              return match, new_block

          for var_name in ["seatedRow", "legPress", "latPulldown", "gluteBridge"]:
              result = enable_video_for(var_name)
              if result:
                  match, new_block = result
                  s = s[:match.start(1)] + new_block + s[match.end(1):]


          s = s.replace("import androidx.compose.animation.Crossfade\n", "")
          s = s.replace("import androidx.compose.animation.core.tween\n", "")

          if "import android.net.Uri\n" not in s:
              s = s.replace(
                  "import android.os.Bundle\n",
                  "import android.os.Bundle\nimport android.net.Uri\n",
                  1,
              )

          media_imports = [
              "import androidx.compose.ui.viewinterop.AndroidView",
              "import androidx.media3.common.MediaItem",
              "import androidx.media3.common.Player",
              "import androidx.media3.exoplayer.ExoPlayer",
              "import androidx.media3.ui.AspectRatioFrameLayout",
              "import androidx.media3.ui.PlayerView",
          ]

          for imp in media_imports:
              line = imp + "\n"
              if line not in s:
                  s = s.replace(
                      "import kotlinx.coroutines.delay\n",
                      line + "import kotlinx.coroutines.delay\n",
                      1,
                  )

          s = re.sub(
              r"\n\s*var frame by rememberSaveable\s*\{\s*mutableIntStateOf\(0\)\s*\}\s*",
              "\n",
              s,
              count=1,
          )

          start = s.find("    LaunchedEffect(\n        isPlaying,")
          if start < 0:
              start = s.find("    LaunchedEffect(isPlaying,")

          if start >= 0:
              nxt = s.find("    LaunchedEffect(", start + 10)
              if nxt > start:
                  s = s[:start] + s[nxt:]

          cross = s.find("Crossfade(")
          if cross < 0:
              raise SystemExit("Crossfade block was not found in MainActivity.kt")

          if_start = s.rfind("if (correctMode)", 0, cross)
          if if_start < 0:
              raise SystemExit("correctMode block was not found")

          m = re.search(r"\n\s*\}\s*else\s*\{\s*\n", s[cross:], re.S)
          if not m:
              raise SystemExit("correctMode else block was not found")

          block_end = cross + m.end()
          indent = s[s.rfind("\n", 0, if_start) + 1:if_start]

          replacement = (
              "if (correctMode) {\n"
              f"{indent}    LocalExerciseVideo(\n"
              f"{indent}        exerciseId = exercise.id,\n"
              f"{indent}        isPlaying = isPlaying,\n"
              f"{indent}        speed = speed,\n"
              f"{indent}        modifier = Modifier.fillMaxSize()\n"
              f"{indent}    )\n"
              f"{indent}}} else {{\n"
          )

          s = s[:if_start] + replacement + s[block_end:]

          s = s.replace("اشتباه خطرناک", "اشتباه رایج")

          s = s.replace(
              'Text("7 حرکت · حدود 55–65 دقیقه"',
              'Text("7 حرکت · حدود \\u200E55–65\\u200E دقیقه"',
          )

          s = s.replace(
              '"${session.exercises.size} حرکت · 55–65 دقیقه"',
              '"${session.exercises.size} حرکت · \\u200E55–65\\u200E دقیقه"',
          )

          s = s.replace(
              "Chip(\n                                ex.reps\n                            )",
              "Chip(\n                                \"\\u200E${ex.reps}\\u200E\"\n                            )",
          )

          s = s.replace(
              "Metric(\n                        exercise.reps,",
              "Metric(\n                        \"\\u200E${exercise.reps}\\u200E\",",
          )

          s = s.replace(
              'MiniInfo(\n                    "55–65",',
              'MiniInfo(\n                    "\\u200E55–65\\u200E",',
          )

          video_fun = r'''
          @Composable
          private fun LocalExerciseVideo(
              exerciseId: String,
              isPlaying: Boolean,
              speed: Float,
              modifier: Modifier = Modifier
          ) {
              val context = LocalContext.current

              val videoRes = when (exerciseId) {
                  "seated_row" -> R.raw.seated_row_real
                  "leg_press" -> R.raw.leg_press_real
                  "lat_pulldown" -> R.raw.lat_pulldown_real
                  "glute_bridge" -> R.raw.glute_bridge_real
                  else -> R.raw.chest_press_real
              }

              val player = remember(exerciseId) {
                  ExoPlayer.Builder(context).build().apply {
                      setMediaItem(
                          MediaItem.fromUri(
                              Uri.parse(
                                  "android.resource://${context.packageName}/$videoRes"
                              )
                          )
                      )
                      repeatMode = Player.REPEAT_MODE_ONE
                      volume = 0f
                      prepare()
                  }
              }

              LaunchedEffect(isPlaying, speed, exerciseId) {
                  player.setPlaybackSpeed(speed)
                  player.playWhenReady = isPlaying
              }

              DisposableEffect(player) {
                  onDispose {
                      player.release()
                  }
              }

              AndroidView(
                  factory = { ctx ->
                      PlayerView(ctx).apply {
                          useController = false
                          resizeMode = AspectRatioFrameLayout.RESIZE_MODE_FIT
                          setShutterBackgroundColor(
                              android.graphics.Color.rgb(242, 246, 250)
                          )
                          this.player = player
                      }
                  },
                  update = { view ->
                      view.player = player
                  },
                  modifier = modifier
              )
          }

          '''

          if "private fun LocalExerciseVideo(" not in s:
              marker = "@Composable\nprivate fun PremiumCard"

              if marker not in s:
                  raise SystemExit("PremiumCard marker was not found")

              s = s.replace(
                  marker,
                  video_fun + marker,
                  1,
              )

          p.write_text(s, encoding="utf-8")
          PY

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "REBUILD"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "9.0.0" apply false
              id("org.jetbrains.kotlin.android") version "2.2.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.2.20" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          android.builtInKotlin=false
          android.newDsl=false
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.rebuild.hamed"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.rebuild.hamed"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 8
                  versionName = "1.7.0"
              }

              buildFeatures {
                  compose = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          dependencies {
              val composeBom =
                  platform("androidx.compose:compose-bom:2025.09.01")

              implementation(composeBom)

              implementation("androidx.core:core-ktx:1.17.0")
              implementation("androidx.activity:activity-compose:1.11.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.9.3")

              implementation("androidx.media3:media3-exoplayer:1.8.0")
              implementation("androidx.media3:media3-ui:1.8.0")

              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          EOF

      - name: Integrate V1.5 premium exercise UX
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/rebuild/hamed/MainActivity.kt")
          s = p.read_text(encoding="utf-8")

          # One exercise screen with context-aware media and tips, preserving the data model.
          start_marker = "@Composable\nfun ExerciseDetailScreen("
          end_marker = "\n@Composable\nfun SafetyScreen("
          start = s.find(start_marker)
          end = s.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("V1.5 insertion point not found: aborting instead of shipping broken UI")

          new_screen = r'''// REBUILD V1.5 — exercise detail screen + resource-aware teaching media.
          // Injected by the GitHub Actions workflow after the V1.4 media patch.

          private data class V15ExerciseMedia(
              val mainVideo: Int,
              val sideVideo: Int? = null,
              val mistakeVideo: Int? = null
          )

          private fun v15MediaFor(id: String): V15ExerciseMedia? = when (id) {
              "chest_press" -> V15ExerciseMedia(R.raw.chest_press_real, sideVideo = R.raw.chest_press_side_view)
              "seated_row" -> V15ExerciseMedia(R.raw.seated_row_real, sideVideo = R.raw.seated_row_side_view)
              "leg_press" -> V15ExerciseMedia(R.raw.leg_press_real, sideVideo = R.raw.leg_press_side_view)
              "lat_pulldown" -> V15ExerciseMedia(R.raw.lat_pulldown_real, sideVideo = R.raw.lat_pulldown_side_view)
              "glute_bridge" -> V15ExerciseMedia(R.raw.glute_bridge_real)
              else -> null
          }

          private fun v15PatternFor(id: String): String = when (id) {
              "chest_press" -> "HORIZONTAL PUSH"
              "seated_row" -> "HORIZONTAL PULL"
              "leg_press", "box_squat" -> "SQUAT PATTERN"
              "lat_pulldown" -> "VERTICAL PULL"
              "glute_bridge" -> "HIP EXTENSION"
              "ham_curl" -> "KNEE FLEXION"
              "dead_bug", "bird_dog" -> "CORE STABILITY"
              "calf_raise" -> "CALF STRENGTH"
              "hip_abduction" -> "HIP STABILITY"
              "biceps" -> "ARM STRENGTH"
              else -> "CONTROLLED STRENGTH"
          }

          private fun v15MusclesFor(id: String): String = when (id) {
              "chest_press" -> "سینه · پشت بازو · جلوی شانه"
              "seated_row" -> "عضلات پشت · پشت شانه · جلو بازو"
              "leg_press" -> "چهارسر ران · باسن · پشت ران"
              "lat_pulldown" -> "لت · عضلات پشت · جلو بازو"
              "glute_bridge" -> "باسن · پشت ران · عضلات مرکزی"
              "ham_curl" -> "پشت ران"
              "box_squat" -> "چهارسر ران · باسن"
              else -> "تقویت هدفمند و کنترل حرکت"
          }

          private fun v15MistakesFor(id: String): List<Pair<String, String>> = when (id) {
              "chest_press" -> listOf(
                  "سر به جلو" to "سر را به تکیه‌گاه نزدیک نگه دار؛ چانه را برای هل دادن جلو نبر.",
                  "بالا انداختن شانه" to "اگر شانه‌ها به گوش نزدیک می‌شوند، وزنه را سبک‌تر کن.",
                  "قفل کردن آرنج" to "پرس را کنترل‌شده تمام کن و آرنج‌ها را با ضربه صاف نکن."
              )
              "seated_row" -> listOf(
                  "تاب دادن تنه" to "وزنه را با عقب‌پرت کردن کمر نکش؛ تنه نسبتاً ثابت بماند.",
                  "جلو آوردن گردن" to "هنگام کشیدن دسته، سر و گردن را هم‌راستای ستون فقرات نگه دار.",
                  "بالا رفتن شانه" to "شانه‌ها را هنگام کشش بالا نینداز."
              )
              "leg_press" -> listOf(
                  "جدا شدن لگن" to "اگر لگن از پشتی بلند می‌شود، دامنه را کمتر کن.",
                  "زانوها به داخل" to "زانوها را تقریباً هم‌جهت پنجه‌ها هدایت کن.",
                  "قفل زانو" to "در انتهای فشار، زانو را با ضربه قفل نکن."
              )
              "lat_pulldown" -> listOf(
                  "کشیدن پشت گردن" to "میله را جلوی بدن پایین بیاور، نه پشت گردن.",
                  "تاب دادن بدن" to "برای پایین آوردن میله، کمر را عقب پرت نکن.",
                  "گردن رو به جلو" to "چانه را برای نزدیک شدن به میله جلو نبر."
              )
              "glute_bridge" -> listOf(
                  "قوس زیاد کمر" to "به‌جای خم کردن کمر، باسن را با کنترل بالا ببر.",
                  "فشار روی گردن" to "وزن را به سر و گردن منتقل نکن.",
                  "باز شدن بیش‌ازحد دنده‌ها" to "دنده‌ها و شکم را کنترل کن؛ حرکت باید از مفصل ران باشد."
              )
              else -> listOf(
                  "حرکت سریع" to "دامنه و سرعت را کنترل کن.",
                  "وزنه بیش‌ازحد" to "در صورت به‌هم‌خوردن فرم، وزنه را کاهش بده."
              )
          }

          @Composable
          fun ExerciseDetailScreen(
              exercise: Exercise,
              store: RebuildStore,
              onBack: () -> Unit
          ) {
              var seconds by rememberSaveable(exercise.id) { mutableIntStateOf(exercise.rest) }
              var timerRunning by rememberSaveable(exercise.id) { mutableStateOf(false) }
              var weight by rememberSaveable(exercise.id) { mutableStateOf(store.weight(exercise.id)) }
              var reps by rememberSaveable(exercise.id) {
                  mutableStateOf(store.reps(exercise.id).ifBlank { exercise.reps.substringBefore('–') })
              }
              var rir by rememberSaveable(exercise.id) { mutableStateOf(store.rir(exercise.id)) }
              var saved by remember(exercise.id) { mutableStateOf(false) }

              LaunchedEffect(timerRunning, seconds) {
                  if (timerRunning && seconds > 0) {
                      delay(1000)
                      seconds--
                  } else if (seconds <= 0) {
                      timerRunning = false
                  }
              }

              val navy = Color(0xFF142338)
              val blue = Color(0xFF2268D5)

              LazyColumn(
                  modifier = Modifier.fillMaxSize(),
                  contentPadding = PaddingValues(start = 18.dp, end = 18.dp, top = 12.dp, bottom = 36.dp),
                  verticalArrangement = Arrangement.spacedBy(15.dp)
              ) {
                  item {
                      Column {
                          BackHeader(exercise.en, exercise.fa, onBack)
                          Spacer(Modifier.height(8.dp))
                          Surface(
                              color = Color(0xFFE8F0FF),
                              shape = RoundedCornerShape(11.dp)
                          ) {
                              Text(
                                  v15PatternFor(exercise.id),
                                  modifier = Modifier.padding(horizontal = 12.dp, vertical = 7.dp),
                                  fontSize = 10.sp,
                                  fontWeight = FontWeight.Black,
                                  color = blue
                              )
                          }
                          Spacer(Modifier.height(9.dp))
                          Text(v15MusclesFor(exercise.id), color = Muted, fontSize = 12.sp)
                      }
                  }

                  item {
                      val media = v15MediaFor(exercise.id)
                      if (media != null) {
                          V15ExerciseMediaCard(exercise, media)
                      } else {
                          Surface(
                              shape = RoundedCornerShape(22.dp),
                              color = Color(0xFFEAF1FA),
                              modifier = Modifier.fillMaxWidth()
                          ) {
                              Column(Modifier.padding(22.dp)) {
                                  Icon(Icons.Default.SmartDisplay, contentDescription = null, tint = blue)
                                  Spacer(Modifier.height(9.dp))
                                  Text("ویدیوی این حرکت در دست تهیه است", color = navy, fontWeight = FontWeight.Bold)
                                  Spacer(Modifier.height(5.dp))
                                  Text("تا آماده‌شدن کلیپ تأییدشده، نکات اجرا و ایمنی را پایین ببین.", color = Muted, fontSize = 12.sp)
                              }
                          }
                      }
                  }

                  item {
                      Row(horizontalArrangement = Arrangement.spacedBy(9.dp)) {
                          Metric("${exercise.sets}", "ست", Modifier.weight(1f))
                          Metric("\u200E${exercise.reps}\u200E", "تکرار", Modifier.weight(1f))
                          Metric("${exercise.rest}s", "استراحت", Modifier.weight(1f))
                      }
                  }

                  item {
                      PremiumCard {
                          Row(verticalAlignment = Alignment.CenterVertically) {
