          @Composable
          private fun V15ExerciseMediaCard(
              exercise: Exercise,
              media: V15ExerciseMedia
          ) {
              val context = LocalContext.current
              var showMistakes by rememberSaveable(exercise.id) { mutableStateOf(false) }
              var sideAngle by rememberSaveable(exercise.id) { mutableStateOf(false) }
              var isPlaying by rememberSaveable(exercise.id) { mutableStateOf(true) }
              var speed by rememberSaveable(exercise.id) { mutableFloatStateOf(1f) }
              var fullscreen by remember { mutableStateOf(false) }
              var currentPosition by remember { mutableLongStateOf(0L) }
              val navy = Color(0xFF142338)
              val blue = Color(0xFF2268D5)

              val selectedRes = when {
                  showMistakes -> media.mistakeVideo
                  sideAngle -> media.sideVideo ?: media.mainVideo
                  else -> media.mainVideo
              }

              val player = remember(exercise.id) {
                  ExoPlayer.Builder(context).build().apply {
                      repeatMode = Player.REPEAT_MODE_ONE
                      volume = 0f
                  }
              }
              DisposableEffect(player) {
                  onDispose { player.release() }
              }
              LaunchedEffect(player, selectedRes) {
                  if (selectedRes != null) {
                      player.setMediaItem(MediaItem.fromUri(Uri.parse("android.resource://${context.packageName}/$selectedRes")))
                      player.prepare()
                  } else {
                      player.pause()
                  }
              }
              LaunchedEffect(player, isPlaying, speed, selectedRes) {
                  player.setPlaybackSpeed(speed)
                  player.playWhenReady = isPlaying && selectedRes != null
              }
              LaunchedEffect(player, selectedRes) {
                  while (true) {
                      currentPosition = player.currentPosition
                      delay(400)
                  }
              }
              val durationMs = player.duration.takeIf { it > 0 } ?: 0L
              val progress = if (durationMs > 0L) {
                  (currentPosition.toFloat() / durationMs.toFloat()).coerceIn(0f, 1f)
              } else 0f

              Column(verticalArrangement = Arrangement.spacedBy(10.dp)) {
                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      FilterChip(
                          selected = !showMistakes,
                          onClick = { showMistakes = false; isPlaying = true },
                          label = { Text("فرم صحیح") },
                          leadingIcon = { Icon(Icons.Default.CheckCircle, contentDescription = null) },
                          modifier = Modifier.weight(1f)
                      )
                      FilterChip(
                          selected = showMistakes,
                          onClick = { showMistakes = true; fullscreen = false },
                          label = { Text("اشتباهات رایج") },
                          leadingIcon = { Icon(Icons.Default.Info, contentDescription = null) },
                          modifier = Modifier.weight(1f)
                      )
                  }

                  if (!showMistakes || media.mistakeVideo != null) {
                      Surface(
                          shape = RoundedCornerShape(22.dp),
                          color = Color(0xFF122037),
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Column {
                              Box(Modifier.fillMaxWidth().aspectRatio(16f / 9f)) {
                                  if (!fullscreen) {
                                      V15VideoSurface(player, Modifier.fillMaxSize())
                                  }
                              }
                              Slider(
                                  value = progress,
                                  onValueChange = { fraction ->
                                      if (durationMs > 0L) player.seekTo((durationMs * fraction).toLong())
                                  },
                                  modifier = Modifier.fillMaxWidth().padding(horizontal = 12.dp),
                                  colors = SliderDefaults.colors(
                                      thumbColor = Color.White,
                                      activeTrackColor = Color(0xFF86B7FF),
                                      inactiveTrackColor = Color(0xFF46566D)
                                  )
                              )
                              Row(
                                  modifier = Modifier.fillMaxWidth().padding(start = 8.dp, end = 8.dp, top = 2.dp, bottom = 5.dp),
                                  verticalAlignment = Alignment.CenterVertically,
                                  horizontalArrangement = Arrangement.spacedBy(3.dp)
                              ) {
                                  IconButton(onClick = { isPlaying = !isPlaying }) {
                                      Icon(
                                          if (isPlaying) Icons.Default.Pause else Icons.Default.PlayArrow,
                                          contentDescription = if (isPlaying) "توقف" else "پخش",
                                          tint = Color.White
                                      )
                                  }
                                  IconButton(onClick = { player.seekTo(0); isPlaying = true }) {
                                      Icon(Icons.Default.Replay, contentDescription = "شروع دوباره", tint = Color.White)
                                  }
                                  Spacer(Modifier.weight(1f))
                                  TextButton(onClick = { speed = if (speed == .5f) 1f else .5f }) {
                                      Text(if (speed == .5f) "0.5×" else "1×", color = Color.White, fontWeight = FontWeight.Bold)
                                  }
                                  IconButton(onClick = { fullscreen = true }) {
                                      Icon(Icons.Default.Fullscreen, contentDescription = "تمام صفحه", tint = Color.White)
                                  }
                              }
                          }
                      }
                  } else {
                      PremiumCard {
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Icon(Icons.Default.FactCheck, contentDescription = null, tint = Color(0xFFB8423C))
                              Spacer(Modifier.width(8.dp))
                              Text("چه اشتباه‌هایی را اصلاح کنیم؟", fontWeight = FontWeight.Black, color = navy, fontSize = 15.sp)
                          }
                          Spacer(Modifier.height(12.dp))
                          v15MistakesFor(exercise.id).forEachIndexed { index, pair ->
                              Surface(
                                  shape = RoundedCornerShape(14.dp),
                                  color = Color(0xFFF8F9FC),
                                  modifier = Modifier.fillMaxWidth()
                              ) {
                                  Row(Modifier.padding(12.dp), verticalAlignment = Alignment.Top) {
                                      Surface(shape = RoundedCornerShape(9.dp), color = Color(0xFFFFE8E5)) {
                                          Text("${index + 1}", modifier = Modifier.padding(horizontal = 9.dp, vertical = 5.dp), color = Color(0xFFB8423C), fontWeight = FontWeight.Black)
                                      }
                                      Spacer(Modifier.width(10.dp))
                                      Column {
                                          Text(pair.first, color = navy, fontWeight = FontWeight.Bold, fontSize = 13.sp)
                                          Spacer(Modifier.height(4.dp))
                                          Text(pair.second, color = Muted, fontSize = 12.sp, lineHeight = 19.sp)
                                      }
                                  }
                              }
                              Spacer(Modifier.height(8.dp))
                          }
                          Text("فیلم اختصاصی این اشتباه‌ها پس از بررسی آموزشی اضافه می‌شود.", color = Muted, fontSize = 11.sp)
                      }
                  }

                  if (!showMistakes) {
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Surface(shape = RoundedCornerShape(12.dp), color = Color(0xFFE8F0FF)) {
                              Text(if (sideAngle) "نمای مایل از کنار" else "نمای اصلی", modifier = Modifier.padding(horizontal = 12.dp, vertical = 8.dp), color = blue, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                          }
                          if (media.sideVideo != null) {
                              Spacer(Modifier.width(8.dp))
                              OutlinedButton(onClick = { sideAngle = !sideAngle; isPlaying = true }) {
                                  Text(if (sideAngle) "نمای اصلی" else "نمای زاویه‌دار")
                              }
                          } else {
                              Spacer(Modifier.width(8.dp))
                              Text("نمای بغل در حال آماده‌سازی", fontSize = 10.sp, color = Muted)
                          }
                      }
                  }

                  if (sideAngle && !showMistakes) {
                      val angleNote = when (exercise.id) {
                          "chest_press" -> "این کلیپ از نمای مایل و با دستگاه متفاوت است؛ بیشتر به گردن، شانه و مسیر آرنج توجه کن."
                          "seated_row" -> "نمای مایل کشش سیم‌کش نشسته؛ تنه را ثابت نگه دار و گردن را جلو نبر."
                          "leg_press" -> "این ویدیو مربوط به پرس پای مایل است و ممکن است با دستگاه تو متفاوت باشد؛ دامنه زانو و موقعیت لگن را بررسی کن."
                          "lat_pulldown" -> "این کلیپ نمای مایل از لت جلو است؛ مسیر میله را جلوی بدن نگه دار و گردن را خنثی حفظ کن."
                          else -> "نوع دستگاه و زاویه دوربین ممکن است با دستگاه باشگاه تو تفاوت داشته باشد."
                      }
                      Text(
                          angleNote,
                          color = Muted,
                          fontSize = 11.sp,
                          lineHeight = 18.sp,
                          modifier = Modifier.padding(horizontal = 5.dp)
                      )
                  }
              }

              if (fullscreen && selectedRes != null) {
                  Dialog(
                      onDismissRequest = { fullscreen = false },
                      properties = DialogProperties(usePlatformDefaultWidth = false)
                  ) {
                      Column(
                          Modifier.fillMaxSize().background(Color(0xFF0D1728)),
                          verticalArrangement = Arrangement.Center
                      ) {
                          Row(Modifier.fillMaxWidth().padding(horizontal = 15.dp), horizontalArrangement = Arrangement.End) {
                              IconButton(onClick = { fullscreen = false }) {
                                  Icon(Icons.Default.Close, contentDescription = "بستن تمام صفحه", tint = Color.White)
                              }
                          }
                          V15VideoSurface(player, Modifier.fillMaxWidth().aspectRatio(16f / 9f))
                          Row(
                              Modifier.fillMaxWidth().padding(12.dp),
                              verticalAlignment = Alignment.CenterVertically,
                              horizontalArrangement = Arrangement.Center
                          ) {
                              IconButton(onClick = { isPlaying = !isPlaying }) {
                                  Icon(if (isPlaying) Icons.Default.Pause else Icons.Default.PlayArrow, contentDescription = null, tint = Color.White)
                              }
                              IconButton(onClick = { player.seekTo(0); isPlaying = true }) {
                                  Icon(Icons.Default.Replay, contentDescription = "شروع دوباره", tint = Color.White)
                              }
                              TextButton(onClick = { speed = if (speed == .5f) 1f else .5f }) {
                                  Text(if (speed == .5f) "0.5×" else "1×", color = Color.White)
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          private fun V15VideoSurface(player: ExoPlayer, modifier: Modifier = Modifier) {
              AndroidView(
                  factory = { ctx ->
                      PlayerView(ctx).apply {
                          useController = false
                          resizeMode = AspectRatioFrameLayout.RESIZE_MODE_FIT
                          setShutterBackgroundColor(android.graphics.Color.rgb(18, 32, 55))
                          this.player = player
                      }
                  },
                  update = { it.player = player },
                  modifier = modifier
              )
          }
          '''
          s = s[:start] + new_screen.rstrip() + "\n" + s[end:]

          for imp in [
              "import androidx.compose.ui.window.Dialog",
              "import androidx.compose.ui.window.DialogProperties",
          ]:
              if imp + "\n" not in s:
                  anchor = "import androidx.compose.ui.viewinterop.AndroidView\n"
                  if anchor not in s:
                      raise SystemExit("AndroidView import missing; ensure V1.4 media patch completed")
                  s = s.replace(anchor, anchor + imp + "\n", 1)

          assert "private fun V15ExerciseMediaCard" in s
          assert "fun ExerciseDetailScreen(" in s
          assert "v15MistakesFor" in s
          assert "fun SafetyScreen()" in s
          p.write_text(s, encoding="utf-8")
          print("V1.5 UI integrated. Kotlin file size:", p.stat().st_size)
          PY
          echo "V1.5 UI ready; checking preserved screen and controls."
          grep -q "private fun V15ExerciseMediaCard" app/src/main/java/com/rebuild/hamed/MainActivity.kt
          grep -q "store.setLog(exercise.id, weight, reps, rir)" app/src/main/java/com/rebuild/hamed/MainActivity.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            --licenses >/dev/null || true

          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Build V1.7 APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload V1.7 APK
        uses: actions/upload-artifact@v4
        with:
          name: REBUILD-v1.7-three-side-views-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
